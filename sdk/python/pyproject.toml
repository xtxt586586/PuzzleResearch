[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puzzleresearch-sdk"
version = "0.1.0"
description = "Python client for the PuzzleResearch API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29"]

[tool.setuptools]
packages = ["puzzleresearch_sdk"]
